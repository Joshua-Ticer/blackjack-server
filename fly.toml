# fly.toml app configuration file generated for blackjack-server-wild-lake-6946 on 2026-09-06T13:56:21-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'blackjack-server-wild-lake-6946'
primary_region = 'iad'

[build]
  dockerfile = 'docker/Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/docs'

[[vm]]
  memory = '4gb'
  cpus = 2
  cpu_kind = 'performance'
  memory_mb = 4096
